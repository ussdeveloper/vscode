<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" id="thecoder-icon">
  <defs>
    <!-- Vibrant blue gradient (Superman-inspired). Keeps recognisable
         depth even at 16px in the titlebar. -->
    <linearGradient id="thecoderBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DA9FF"/>
      <stop offset="55%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0033CC"/>
    </linearGradient>
  </defs>

  <!-- Black tile with rounded corners so the icon reads as an app badge
       even at very small sizes (down to 16x16 in the titlebar). -->
  <rect x="0" y="0" width="1024" height="1024" rx="160" ry="160" fill="#000000"/>

  <!-- Chunky geometric S, drawn as text so it stays razor-sharp at every
       size and respects font metrics. The fallback to a path-style font
       face (`Arial Black` -> `Impact` -> serif heavyweight) guarantees a
       bold stroke even on systems missing the primary family. -->
  <text x="512" y="512"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif"
        font-weight="900"
        font-size="900"
        font-style="italic"
        fill="url(#thecoderBlue)"
        stroke="#7DC9FF"
        stroke-width="14"
        paint-order="stroke fill">S</text>
</svg>
